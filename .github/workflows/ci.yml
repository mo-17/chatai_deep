name: ci
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16@sha256:eb4759788a2182f08257135e61a34f2cfc3c2914079f3465d64ee62350f4d081
        env:
          POSTGRES_USER: huangzhibin
          POSTGRES_DB: chatgpt_flutter
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm node:lint
      - run: pnpm --filter chatgpt_backend run build
      - name: Compiled production runner applies migrations to empty PostgreSQL
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter chatgpt_backend migration:run:prod | tee /tmp/migration-prod.log
          grep -Fq 'Applied 4 migration(s)' /tmp/migration-prod.log
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_USER: huangzhibin
          DB_PASSWORD: ''
          DB_NAME: chatgpt_flutter
          DB_POOL_MAX: '1'
      - name: Source migration runner verifies no-op
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter chatgpt_backend migration:run | tee /tmp/migration-source.log
          grep -Fq 'No migrations are pending' /tmp/migration-source.log
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_USER: huangzhibin
          DB_PASSWORD: ''
          DB_NAME: chatgpt_flutter
          DB_POOL_MAX: '1'
      - name: Cloudflare worker and startup policy gates
        shell: bash
        run: |
          pnpm backend:cloudflare:test
          pnpm backend:cloudflare:check
          timeout 60s pnpm backend:cloudflare:supervisor-test
          ! env REQUIRE_PRODUCTION_MODE=true NODE_ENV=prod \
            DB_SYNCHRONIZE=false sh cloudflare/backend/start-container.sh
          ! env REQUIRE_PRODUCTION_MODE=true NODE_ENV=production \
            DB_SYNCHRONIZE=true sh cloudflare/backend/start-container.sh
          ! env REQUIRE_PRODUCTION_MODE=true NODE_ENV=production \
            DB_SYNCHRONIZE=false \
            JWT_SECRET=ci-test-jwt-secret-0123456789-abcdefghijklmnopqrstuvwxyz \
            ADMIN_DEFAULT_PASSWORD=ci-test-admin-password \
            sh cloudflare/backend/start-container.sh
          ! env REQUIRE_PRODUCTION_MODE=true NODE_ENV=production \
            DB_SYNCHRONIZE=false \
            JWT_SECRET=ci-test-jwt-secret-0123456789-abcdefghijklmnopqrstuvwxyz \
            APP_SECRET_KEY=ci-test-app-key-0123456789-abcdefghijklmnopqrstuvwxyz \
            sh cloudflare/backend/start-container.sh
          ! env REQUIRE_PRODUCTION_MODE=true NODE_ENV=production \
            DB_SYNCHRONIZE=false REQUIRE_PERSISTENT_UPLOADS=true \
            JWT_SECRET=ci-test-jwt-secret-0123456789-abcdefghijklmnopqrstuvwxyz \
            APP_SECRET_KEY=ci-test-app-key-0123456789-abcdefghijklmnopqrstuvwxyz \
            ADMIN_DEFAULT_PASSWORD=ci-test-admin-password \
            sh cloudflare/backend/start-container.sh
      - name: Generated Cloudflare types are current
        run: |
          pnpm backend:cloudflare:types
          git diff --exit-code -- cloudflare/backend/worker-configuration.d.ts
      - name: Build and smoke production backend image
        shell: bash
        run: |
          set -euo pipefail
          docker build -f Dockerfile.cloudflare-backend \
            -t chatai-backend:ci .
          docker run -d --name chatai-backend-ci --network host \
            -e NODE_ENV=production \
            -e DB_SYNCHRONIZE=false \
            -e REQUIRE_PRODUCTION_MODE=true \
            -e DB_HOST=127.0.0.1 \
            -e DB_PORT=5432 \
            -e DB_USER=huangzhibin \
            -e DB_PASSWORD= \
            -e DB_NAME=chatgpt_flutter \
            -e DB_SSL=false \
            -e JWT_SECRET=ci-test-jwt-secret-0123456789-abcdefghijklmnopqrstuvwxyz \
            -e APP_SECRET_KEY=ci-test-app-key-0123456789-abcdefghijklmnopqrstuvwxyz \
            -e ADMIN_DEFAULT_PASSWORD=ci-test-admin-password \
            chatai-backend:ci
          cleanup() {
            docker logs chatai-backend-ci || true
            docker rm -f chatai-backend-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/healthz; then
              exit 0
            fi
            if ! docker inspect -f '{{.State.Running}}' chatai-backend-ci | \
              grep -q true; then
              exit 1
            fi
            sleep 1
          done
          exit 1
      - name: Baseline migration greenfield and legacy-data gates
        run: >-
          pnpm --filter chatgpt_backend exec jest
          src/database/core-baseline.postgres.spec.ts --runInBand
        env:
          BASELINE_PG_INTEGRATION: '1'
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_USER: huangzhibin
          DB_PASSWORD: ''
          DB_NAME: chatgpt_flutter
          DB_POOL_MAX: '1'
      - name: Sync v2 real PostgreSQL concurrency gates
        run: >-
          pnpm --filter chatgpt_backend exec jest
          src/sync-v2/sync-v2.postgres.spec.ts --runInBand
        env:
          SYNC_V2_PG_INTEGRATION: '1'
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_USER: huangzhibin
          DB_PASSWORD: ''
          DB_NAME: chatgpt_flutter
      - run: pnpm --filter chatgpt_backend exec jest --runInBand
        env:
          JWT_SECRET: ci-test-jwt-secret-0123456789-abcdefghijklmnopqrstuvwxyz
          APP_SECRET_KEY: ci-test-app-key-0123456789-abcdefghijklmnopqrstuvwxyz
      - run: pnpm --filter chatgpt_admin run typecheck
      - run: pnpm --filter chatgpt_admin run build
        env:
          NEXT_PUBLIC_BACKEND: http://localhost:3000

  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Flutter toolchain
        run: flutter --version
      - name: OpenAI SDK gates
        working-directory: openai_flutter
        run: |
          flutter pub get
          flutter analyze --no-pub
          flutter test --no-pub
      - name: Login SDK gates
        working-directory: login_sdk
        run: |
          flutter pub get
          flutter analyze --no-pub
          flutter test --no-pub
      - name: Downloader gates
        working-directory: hi_download
        run: |
          flutter pub get
          flutter analyze --no-pub
          flutter test --no-pub
      - name: Shared app core gates
        working-directory: chatgpt_app_core
        run: |
          flutter pub get
          flutter analyze --no-pub
          # 多个资源/备份测试会替换进程级 resolver，串行运行避免相互污染。
          flutter test --no-pub --concurrency=1
      - name: Android shell gates
        working-directory: chatgpt_flutter
        run: |
          flutter pub get
          flutter analyze --no-pub
          flutter test --no-pub
          flutter build apk --debug --no-pub
      - name: Android distribution contract
        working-directory: chatgpt_flutter
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-debug.apk
          AAPT2=$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -1)
          test -n "$AAPT2"
          "$AAPT2" dump badging "$APK" | grep -q "package: name='com.example.chatgpt_flutter'"
          DEBUG_PERMISSIONS=$("$AAPT2" dump permissions "$APK")
          grep -q 'android.permission.REQUEST_INSTALL_PACKAGES' <<< "$DEBUG_PERMISSIONS"
          ! grep -q 'REQUEST_INSTALL_PACKAGES' android/app/src/main/AndroidManifest.xml
          ! grep -q 'usesCleartextTraffic="true"' android/app/src/main/AndroidManifest.xml
          grep -q 'tools:node="remove"' android/app/src/store/AndroidManifest.xml
          grep -q 'usesCleartextTraffic="false"' android/app/src/store/AndroidManifest.xml
      - name: Build and inspect store release APK
        working-directory: chatgpt_flutter
        shell: bash
        env:
          CHATGPT_DISTRIBUTION: store
          CHATGPT_STORE_APPLICATION_ID: com.chataideep.ci
          CHATGPT_STORE_KEYSTORE_PATH: ${{ runner.temp }}/chataideep-ci-store.jks
          CHATGPT_STORE_KEYSTORE_PASSWORD: ci-store-password
          CHATGPT_STORE_KEY_ALIAS: ci-store
          CHATGPT_STORE_KEY_PASSWORD: ci-store-password
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt \
            -keystore "$CHATGPT_STORE_KEYSTORE_PATH" \
            -storepass "$CHATGPT_STORE_KEYSTORE_PASSWORD" \
            -keypass "$CHATGPT_STORE_KEY_PASSWORD" \
            -alias "$CHATGPT_STORE_KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=CI, OU=CI, O=ChatAI Deep, L=CI, ST=CI, C=US"
          flutter build apk --release --no-pub \
            --dart-define=APP_DISTRIBUTION=store \
            --dart-define=BACKEND_HOST=api.example.com \
            --dart-define=BACKEND_HTTPS=true

          APK=build/app/outputs/flutter-apk/app-release.apk
          APKANALYZER=$(find "$ANDROID_HOME" -type f -name apkanalyzer | sort -V | tail -1)
          test -f "$APK"
          test -n "$APKANALYZER"
          test "$("$APKANALYZER" manifest application-id "$APK")" = \
            "$CHATGPT_STORE_APPLICATION_ID"
          STORE_PERMISSIONS=$("$APKANALYZER" manifest permissions "$APK")
          if grep -q 'android.permission.REQUEST_INSTALL_PACKAGES' \
            <<< "$STORE_PERMISSIONS"; then
            echo 'Store APK unexpectedly requests package installation.' >&2
            exit 1
          fi
          "$APKANALYZER" manifest print "$APK" | \
            grep -q 'android:usesCleartextTraffic="false"'
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-flutter-debug-apk
          path: chatgpt_flutter/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
