name: android-offline-smoke

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: '17 19 * * 1-5'

concurrency:
  group: android-offline-smoke
  cancel-in-progress: true

jobs:
  offline-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        working-directory: chatgpt_flutter
        run: flutter pub get --no-example
      - name: Cache bundled offline speech models
        uses: actions/cache@v4
        with:
          path: chatgpt_flutter/assets/sherpa_onnx/matcha-icefall-zh-baker
          key: bundled-tts-${{ hashFiles('tool/prepare_bundled_tts.py', 'tool/tts/manifest.json') }}
      - name: Prepare bundled offline speech models
        run: python3 tool/prepare_bundled_tts.py
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run offline Android smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: >-
            cd chatgpt_flutter &&
            flutter test integration_test/offline_smoke_test.dart
            --no-pub -d emulator-5554 --reporter expanded
