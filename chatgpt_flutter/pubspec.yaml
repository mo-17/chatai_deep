name: chatgpt_flutter
description: ChatGPT Flutter Android/iOS app shell
publish_to: 'none'
version: 1.0.4+13

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  chatgpt_app_core:
    path: ../chatgpt_app_core
  login_sdk:
    path: ../login_sdk
  flutter_splash_screen: ^4.0.0
  shared_preferences: ">=2.2.0 <2.3.0"
  package_info_plus: ^9.0.0
  workmanager: ^0.9.0+3
  flutter_secure_storage: ^10.3.1

# ───────────────────────────────────────────────────────────────────────────
# 【临时】OCR 插件用本地 Dart-only stub 覆盖，使 iOS 模拟器可编译。
# 原因：google_mlkit / pdfx 的预编译二进制没有 arm64 模拟器切片，
#       Apple Silicon 的 iOS 模拟器无法链接 → 构建失败。
# 影响：覆盖期间整个 iOS/Android 构建都【没有 OCR】（调用会抛 UnsupportedError）。
# 还原：等有 iOS 真机时，直接删除下面整个 dependency_overrides 块即可恢复 OCR。
dependency_overrides:
  google_mlkit_text_recognition:
    path: ../ohos_stubs/google_mlkit_text_recognition
  pdfx:
    path: ../ohos_stubs/pdfx

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_hi_cache: ^0.0.1
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sherpa_onnx/matcha-icefall-zh-baker/manifest.json
    - assets/sherpa_onnx/matcha-icefall-zh-baker/vocos-22khz-univ.onnx
    - assets/sherpa_onnx/matcha-icefall-zh-baker/matcha-icefall-zh-baker/model-steps-3.onnx
    - assets/sherpa_onnx/matcha-icefall-zh-baker/matcha-icefall-zh-baker/tokens.txt
    - assets/sherpa_onnx/matcha-icefall-zh-baker/matcha-icefall-zh-baker/lexicon.txt
    - assets/sherpa_onnx/matcha-icefall-zh-baker/matcha-icefall-zh-baker/phone.fst
    - assets/sherpa_onnx/matcha-icefall-zh-baker/matcha-icefall-zh-baker/date.fst
    - assets/sherpa_onnx/matcha-icefall-zh-baker/matcha-icefall-zh-baker/number.fst
    - assets/sherpa_onnx/matcha-icefall-zh-baker/matcha-icefall-zh-baker/dict/
