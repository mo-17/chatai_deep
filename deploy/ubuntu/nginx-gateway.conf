# 当前服务商在 HTTPS 网关终止 TLS，再向本机 80 转发。
# 已实测网关设置 X-Forwarded-Proto；普通公网直连部署应另配本机 TLS。
# 长映射域名需要更大的 http 级域名哈希桶；不要重复定义此指令。
server_names_hash_bucket_size 128;

server {
    listen 80;
    server_name 01a14fea704875d49fb78b48f2092eee.cn-hongkong-2.a8g1v3.xyz 01a134db158e7762b017af8a3940002c.cn-hongkong-2.r4j2x7.top;
    client_max_body_size 50m;

    # 该网关覆盖客户端传入的协议头。应用内容只经 HTTPS 提供。
    if ($http_x_forwarded_proto != https) {
        return 308 https://$host$request_uri;
    }

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;

    # 大体积安装包通过服务商已有 HTTPS 网关下载。
    location ^~ /downloads/ {
        alias /var/www/chatai-website/downloads/;
        autoindex off;
        default_type application/octet-stream;
        sendfile on;
        max_ranges 1;
        add_header Content-Disposition attachment;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=86400";
        limit_except GET { deny all; }
    }

    location /uapi/ {
        proxy_pass http://127.0.0.1:3000;
    }
    location = /healthz {
        proxy_pass http://127.0.0.1:3000;
    }
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
    }
    location / {
        proxy_pass http://127.0.0.1:3001;
    }
}
