# 七牛共享 IP 的 TCP 映射：公网 10083 -> 本机 80，公网 10084 -> 本机 443。
# 证书只包含 kushui.shop；www 的 HTTP 入口统一跳转根域名。
# Cloudflare 使用标准 HTTPS 入口；保留直接回源测试时的原端口语义。
map $http_host $chatai_external_port {
    default 443;
    ~:10084$ 10084;
}

server {
    listen 80;
    listen [::]:80;
    server_name kushui.shop www.kushui.shop;
    return 308 https://kushui.shop$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name kushui.shop;

    ssl_certificate /etc/letsencrypt/live/kushui.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kushui.shop/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:CHATAI_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 50m;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port $chatai_external_port;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;

    # 先执行 publish-website.sh 安装官网文件和此 snippet，再重载该配置。
    include /etc/nginx/snippets/chatai-website-locations.conf;

    location /uapi/ {
        proxy_pass http://127.0.0.1:3000;
    }
    location = /healthz {
        proxy_pass http://127.0.0.1:3000;
    }
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
    }
    location / {
        proxy_pass http://127.0.0.1:3001;
    }
}
