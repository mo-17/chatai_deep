# 安装到 /etc/nginx/snippets/，仅在 kushui.shop 的 TLS server 中 include。
# 精确根路由提供官网；原 /login、/dashboard、/api/* 等仍由 Next.js 处理。
location = / {
    root /var/www/chatai-website/current;
    try_files /index.html =503;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/chatai-website-headers.conf;
}

location = /index.html {
    absolute_redirect off;
    return 308 /;
}

location ^~ /site-assets/ {
    root /var/www/chatai-website/current;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=300";
    include /etc/nginx/snippets/chatai-website-headers.conf;
}

location = /robots.txt {
    root /var/www/chatai-website/current;
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/chatai-website-headers.conf;
}

location ^~ /downloads/ {
    alias /var/www/chatai-website/downloads/;
    autoindex off;
    default_type application/octet-stream;
    sendfile on;
    max_ranges 1;
    add_header Content-Disposition attachment;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "public, max-age=86400";
    limit_except GET { deny all; }
}

location = /admin {
    absolute_redirect off;
    return 302 /login;
}

location = /admin/ {
    absolute_redirect off;
    return 302 /login;
}
