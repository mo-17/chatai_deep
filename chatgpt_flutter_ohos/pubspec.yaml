name: chatgpt_flutter_ohos
description: ChatGPT Flutter 鸿蒙端 app shell
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  chatgpt_app_core:
    path: ../chatgpt_app_core
  login_sdk:
    path: ../login_sdk
  chatai_ohos_image_picker:
    path: ../ohos_plugins/image_picker

dependency_overrides:
  sqflite:
    git:
      url: https://gitee.com/openharmony-sig/flutter_sqflite.git
      path: sqflite
      ref: 0bd638a416215b9ab74f21eef98e14797827df04
  sqflite_common_ffi:
    git:
      url: https://gitee.com/openharmony-sig/flutter_sqflite.git
      path: sqflite_common_ffi
      ref: 0bd638a416215b9ab74f21eef98e14797827df04
  path_provider:
    git:
      url: https://gitee.com/openharmony-sig/flutter_packages.git
      path: packages/path_provider/path_provider
      ref: 35fb467533e174411a117b2a030c15d2a3a9687c
  url_launcher:
    git:
      url: https://gitee.com/openharmony-sig/flutter_packages.git
      path: packages/url_launcher/url_launcher
      ref: 35fb467533e174411a117b2a030c15d2a3a9687c
  shared_preferences:
    git:
      url: https://gitee.com/openharmony-sig/flutter_packages.git
      path: packages/shared_preferences/shared_preferences
      ref: 35fb467533e174411a117b2a030c15d2a3a9687c
  # package_info_plus: 暂无鸿蒙实现，通过 §6.4 运行时分支兜底
  # OCR 插件无鸿蒙实现：覆盖到本地空实现 stub，使共享核心可编译；
  # 运行时由 OcrService.isSupported（仅 Android/iOS）守卫，OHOS 上永不调用。
  google_mlkit_text_recognition:
    path: ../ohos_stubs/google_mlkit_text_recognition
  pdfx:
    path: ../ohos_stubs/pdfx
  # 本地适配通过壳注册的原生文件选择器读写授权 URI。
  file_picker:
    path: ../ohos_plugins/file_picker
  # flutter_js 无鸿蒙实现：覆盖到本地空实现 stub；
  # 运行时由 JsRuntimeService.isSupported（非 OHOS）守卫，脚本执行永不触达。
  flutter_js:
    path: ../ohos_stubs/flutter_js
  # 本地适配通过鸿蒙 ShareKit 分享文本与应用沙箱文件。
  share_plus:
    path: ../ohos_plugins/share_plus
  # flutter_tts 无鸿蒙实现：覆盖到本地空实现 stub；
  # 运行时由 FlutterTtsReadAloudService.isSupported（非 OHOS）守卫。
  flutter_tts:
    path: ../ohos_stubs/flutter_tts

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
