<?xml version="1.0" encoding="UTF-8"?>
<!--
  botanical 背景 · 装饰用植物剪影
  · viewBox 380x760 与 PHONE_W/H 对齐
  · preserveAspectRatio="xMidYMid slice" 让 SVG 在不同手机宽高比下铺满裁切
  · 全部使用 currentColor，由 flutter_svg 的 colorFilter 在运行时染色 (建议 T.primary 或 T.text)
  · 透明度由 SVG 内 opacity 控制；外层组件再叠一层 0.6~0.8 的整体 alpha
  · 8 片叶子分两簇：左上 + 右下，留出中部给玻璃卡片
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 380 760"
     preserveAspectRatio="xMidYMid slice"
     width="380" height="760">
  <!-- ── 左上簇：4 片叶子 ───────────────────────────── -->
  <g fill="currentColor">
    <!-- 大叶 · 倾斜 -25° -->
    <g transform="translate(-20 60) rotate(-25)" opacity="0.22">
      <path d="M 0 0
               C 55 18, 95 56, 110 110
               C 70 100, 30 70, 0 0 Z" />
      <path d="M 8 8 C 40 30, 70 60, 100 100" stroke="currentColor" stroke-width="1.2" fill="none" opacity="0.55" />
    </g>
    <!-- 中叶 · 倾斜 18° -->
    <g transform="translate(70 -10) rotate(18)" opacity="0.18">
      <path d="M 0 0
               C 38 12, 68 38, 78 80
               C 50 72, 22 50, 0 0 Z" />
      <path d="M 6 6 C 28 22, 50 42, 72 74" stroke="currentColor" stroke-width="1" fill="none" opacity="0.5" />
    </g>
    <!-- 小叶 · 倾斜 60° -->
    <g transform="translate(150 30) rotate(60)" opacity="0.16">
      <path d="M 0 0
               C 24 8, 44 24, 50 52
               C 30 46, 14 32, 0 0 Z" />
    </g>
    <!-- 蕨叶羽片 · 倾斜 -10° -->
    <g transform="translate(20 130) rotate(-10)" opacity="0.13">
      <path d="M 0 0
               L 120 6
               L 118 14
               L 0 8 Z" />
      <g fill="none" stroke="currentColor" stroke-width="1" opacity="0.6">
        <path d="M 18 8 L 14 -6" />
        <path d="M 36 9 L 32 -8" />
        <path d="M 54 10 L 50 -8" />
        <path d="M 72 11 L 68 -7" />
        <path d="M 90 12 L 86 -4" />
      </g>
    </g>
  </g>

  <!-- ── 右下簇：4 片叶子 ───────────────────────────── -->
  <g fill="currentColor">
    <!-- 大叶 · 倾斜 155° -->
    <g transform="translate(400 700) rotate(155)" opacity="0.22">
      <path d="M 0 0
               C 55 18, 95 56, 110 110
               C 70 100, 30 70, 0 0 Z" />
      <path d="M 8 8 C 40 30, 70 60, 100 100" stroke="currentColor" stroke-width="1.2" fill="none" opacity="0.55" />
    </g>
    <!-- 中叶 · 倾斜 200° -->
    <g transform="translate(310 770) rotate(200)" opacity="0.18">
      <path d="M 0 0
               C 38 12, 68 38, 78 80
               C 50 72, 22 50, 0 0 Z" />
      <path d="M 6 6 C 28 22, 50 42, 72 74" stroke="currentColor" stroke-width="1" fill="none" opacity="0.5" />
    </g>
    <!-- 小叶 · 倾斜 -45° -->
    <g transform="translate(230 720) rotate(-45)" opacity="0.16">
      <path d="M 0 0
               C 24 8, 44 24, 50 52
               C 30 46, 14 32, 0 0 Z" />
    </g>
    <!-- 蕨叶羽片 · 倾斜 170° -->
    <g transform="translate(360 620) rotate(170)" opacity="0.13">
      <path d="M 0 0
               L 120 6
               L 118 14
               L 0 8 Z" />
      <g fill="none" stroke="currentColor" stroke-width="1" opacity="0.6">
        <path d="M 18 8 L 14 -6" />
        <path d="M 36 9 L 32 -8" />
        <path d="M 54 10 L 50 -8" />
        <path d="M 72 11 L 68 -7" />
        <path d="M 90 12 L 86 -4" />
      </g>
    </g>
  </g>
</svg>
