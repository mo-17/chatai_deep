name: chatgpt_app_core
description: 业务核心：UI / DAO / Provider / Util，三端共享
version: 0.0.1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  login_sdk:
    path: ../login_sdk
  hi_download:
    path: ../hi_download
  chat_message:
    path: ../chat_message
  openai_flutter:
    path: ../openai_flutter
  sqflite: ^2.4.0
  sqflite_common_ffi: ^2.3.0
  flutter_hi_cache: ^0.0.1
  provider: ^6.1.5+1
  url_launcher: ^6.3.2
  http: ^1.6.0
  cached_network_image: ^3.4.1
  lottie: ^3.3.3
  package_info_plus: ^9.0.0
  open_filex: ^4.7.0
  speech_to_text: ^7.0.0
  image_picker: ^1.1.2
  file_picker: ^11.0.2
  syncfusion_flutter_pdf: ^33.2.12
  archive: ^4.0.9
  # OCR（仅 Android/iOS 有原生实现；其它平台运行时由 OcrService.isSupported 守卫）
  google_mlkit_text_recognition: ^0.15.0
  pdfx: ^2.9.1
  # JS 引擎（QuickJS via flutter_js）：执行技能自带的 scripts/*.js（纯计算沙箱）。
  # 无鸿蒙原生实现，OHOS shell 用 ohos_stubs/flutter_js override；
  # 运行时由 JsRuntimeService.isSupported（非 OHOS/非 Web）守卫。
  flutter_js: ^0.8.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lottie/
