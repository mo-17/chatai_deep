name: chatgpt_app_core
description: 业务核心：UI / DAO / Provider / Util，三端共享
version: 0.0.1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  login_sdk:
    path: ../login_sdk
  hi_download:
    path: ../hi_download
  chat_message:
    path: ../chat_message
  openai_flutter:
    path: ../openai_flutter
  sqflite: ^2.4.0
  sqflite_common_ffi: ^2.3.0
  flutter_hi_cache: ^0.0.1
  provider: ^6.1.5+1
  url_launcher: ^6.3.2
  http: ^1.6.0
  cached_network_image: ^3.4.1
  lottie: ^3.3.3
  package_info_plus: ^9.0.0
  open_filex: ^4.7.0
  speech_to_text: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lottie/
