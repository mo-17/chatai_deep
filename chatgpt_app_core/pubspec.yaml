name: chatgpt_app_core
description: 业务核心：UI / DAO / Provider / Util，多端共享
version: 0.0.1
publish_to: 'none'

environment:
  # 与 SQLite Web 依赖的实际最低 SDK 要求保持一致。
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  login_sdk:
    path: ../login_sdk
  hi_download:
    path: ../hi_download
  chat_message:
    path: ../chat_message
  openai_flutter:
    path: ../openai_flutter
  sqflite: ^2.4.0
  sqflite_common_ffi: ^2.3.0
  # 与现有 sqlite3 2.x / Dart 3.9 保持兼容，浏览器数据库持久化到 IndexedDB。
  sqflite_common_ffi_web: 0.4.5+4
  flutter_hi_cache: ^0.0.1
  provider: ^6.1.5+1
  url_launcher: ^6.3.2
  http: ^1.6.0
  cached_network_image: ^3.4.1
  lottie: ^3.3.3
  package_info_plus: ^9.0.0
  open_filex: ^4.7.0
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.3
  image_picker: ^1.1.2
  # 本机文档裁边、透视校正与受限图片编码；不上传照片做预处理。
  image: 4.8.0
  file_picker: ^11.0.2
  path_provider: ^2.1.5
  syncfusion_flutter_pdf: ^33.2.12
  archive: ^4.0.9
  # Word / Excel 的 OOXML 正文与工作表解析，沿用已锁定的纯 Dart 依赖。
  xml: ^6.6.1
  # OCR（仅 Android/iOS 有原生实现；其它平台运行时由 OcrService.isSupported 守卫）
  google_mlkit_text_recognition: ^0.15.0
  pdfx: ^2.9.1
  # JS 引擎（QuickJS via flutter_js）：执行技能自带的 scripts/*.js（纯计算沙箱）。
  # 无鸿蒙原生实现，OHOS shell 用 ohos_stubs/flutter_js override；
  # 运行时由 JsRuntimeService.isSupported（非 OHOS/非 Web）守卫。
  flutter_js: ^0.8.2
  share_plus: ^12.0.2
  sherpa_onnx: ^1.13.3
  audioplayers: ^6.7.1
  crypto: ^3.0.6
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # 仅测试用：在 widget 测试里 mock HiCache 背后的 SharedPreferences。
  shared_preferences: ^2.5.5

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lottie/
    - assets/icons/starcore/
